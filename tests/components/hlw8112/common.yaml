uart:
  - id: uart_hlw8112
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}
    baud_rate: 9600

sensor:
  - platform: hlw8112
    voltage:
      name: HLW8112 Voltage
    current_1:
      name: HLW8112 Current 1
    current_2:
      name: HLW8112 Current 2
    active_power_1:
      name: HLW8112 Active Power 1
    active_power_2:
      name: HLW8112 Active Power 2
    energy_1:
      name: HLW8112 Energy 1
    energy_2:
      name: HLW8112 Energy 2
    energy_total:
      name: HLW8112 Total energy
